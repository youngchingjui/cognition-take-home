services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devin
      POSTGRES_PASSWORD: devin
      POSTGRES_DB: devin_webhook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devin -d devin_webhook"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://devin:devin@db:5432/devin_webhook
    depends_on:
      db:
        condition: service_healthy

  smee:
    image: node:20-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "npm install -g smee-client && smee --url $${SMEE_URL} --target http://app:8000/webhook/github"]
    env_file:
      - .env
    depends_on:
      - app
    profiles:
      - dev

volumes:
  pgdata:
